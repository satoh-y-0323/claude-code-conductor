name: Tests

# Run the full (non-slow) test suite + breaking-changes recording check on
# every push to main and every pull request. Mirrors the local `pytest`
# invocation (pyproject `addopts = -m 'not slow'` excludes the heavy
# fastembed-model tests, so CI does not download the ~220MB model).
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu は対応 Python 全バージョン、windows / macos は代表 1 バージョン。
        # OS を分ける理由: パス正規化・大小無視ファイルシステム依存の挙動
        # （`.claude/.gitignore` の否定パターン解決・`Path.resolve()` の実体ケース正準化・
        # `_validate_deletion_path` の init-only 保護）は単一 OS では検証できない。
        # ubuntu は大小区別 FS のため大小依存テストが skip され、windows / macos の
        # 大小無視 FS でのみ実行される（skip 判定自体も OS ごとに確認する必要がある）。
        include:
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.12'
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Run tests
        run: python -m pytest

      - name: Check breaking changes are recorded
        run: python scripts/extract_breaking_changes.py --check
