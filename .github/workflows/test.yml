name: Tests

# Run the full (non-slow) test suite + breaking-changes recording check on
# every push to main and every pull request. Mirrors the local `pytest`
# invocation (pyproject `addopts = -m 'not slow'` excludes the heavy
# fastembed-model tests, so CI does not download the ~220MB model).
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu は対応 Python 全バージョン、windows / macos は代表 1 バージョン。
        # 3 OS マトリクスを維持する理由: パス正規化・`Path.resolve()` / `os.path.normcase`
        # の OS 差を実測で押さえるため。単一 OS では以下の退行を検知できない:
        # - `.claude/.gitignore` の否定パターン解決・ファイルシステム依存の実体パス正規化
        # - `_validate_deletion_path` の init-only 保護（二重スラッシュ・末尾スラッシュ・
        #   大小違い等の表記ゆれ正規化は全 OS で実行されるため、各 OS での実装挙動を検証）
        # 是正後、大小違いテストは全 OS で実行される（実在ファイル版は FS 依存性あり）。
        include:
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.12'
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Run tests
        run: python -m pytest

      - name: Check breaking changes are recorded
        run: python scripts/extract_breaking_changes.py --check

  # 削除検出は git 履歴走査とパス文字列判定のみで OS 差を持たないため ubuntu 1 構成で十分。
  # 既存の test matrix (5 構成) に fetch-depth: 0 を付けると全構成が full clone になるため
  # 専用 job に分ける。
  deletions-check:
    name: check_deletions (deletions.txt 未記載検出)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          # check_deletions.py は `git describe --tags` と `git diff <tag>..HEAD` を使う。
          # 既定の fetch-depth: 1 ではタグも履歴も無く、スクリプトが exit 0 で素通りして
          # 「空の緑」になるため全履歴が必須。
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Check deletions are recorded
        run: python scripts/check_deletions.py --check

  # wheel 実体検証は zip 内パス文字列の判定で OS 差を持たないため ubuntu 1 構成で十分。
  # 既定モード（フラグなし）は `python -m build`（引数なし＝ sdist を作りその sdist から
  # wheel を作る）を実行し、publish.yml の公開経路とビルド入力まで一致させる。
  # `--wheel <path>` を付けると既存アーティファクトの検証になり公開経路を回さないため付けない。
  #
  # 「空の緑」対策: sdist は VCS ignore を尊重するため、除外フィルタが実際に落とす候補は
  # 自然には 1 件も存在しない（実測）。そこで pyproject.toml の sdist force-include で
  # `.claude/state/setup_done.flag` を注入対照として sdist にだけ入れ、
  # 「sdist に在る・wheel に無い・候補件数 1 以上」を verify_wheel.py が毎実行検証する。
  # 対照検証は script 内蔵のため YAML 側にフラグは無い（凍結は tests/test_verify_wheel.py の P8）。
  wheel-check:
    name: verify_wheel (wheel 実体と _excludes 意図の突合)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install package + build backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install build

      - name: Verify wheel contents
        run: python scripts/verify_wheel.py
