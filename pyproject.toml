[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "claude-code-conductor"
dynamic = ["version"]
description = "Multi-agent orchestration framework for Claude Code with Codex/Cursor adapters (C3)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "satoh-y-0323" }
]
keywords = ["claude", "claude-code", "codex", "cursor", "agents", "orchestration", "tdd"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = [
    "PyYAML>=6.0",
    "duckdb>=0.10",
    "numpy>=1.22",
    "fastembed>=0.8.0",
]

[project.scripts]
c3 = "c3.cli:main"

[project.urls]
Homepage = "https://github.com/satoh-y-0323/claude-code-conductor"
Repository = "https://github.com/satoh-y-0323/claude-code-conductor"

[tool.hatch.version]
path = "src/c3/__init__.py"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/c3"]

[tool.hatch.build.targets.wheel.force-include]
"src/c3/_template" = "c3/_template"
"LICENSES" = "c3/LICENSES"

[tool.hatch.build.targets.sdist]
include = [
    "src/c3",
    "tests",
    "hatch_build.py",
    ".claude",
    "README.md",
    "LICENSE",
    "LICENSES",
    "CHANGELOG.md",
    "ARCHITECTURE.md",
]
exclude = [
    ".claude/reports/*",
    ".claude/memory/sessions/*",
    ".claude/memory/patterns.json",
    ".claude/memory/agent-audit.log",
    ".claude/tmp/*",
    ".claude/docs/decisions.md",
    ".claude/docs/taxonomy.md",
]

# 公開ビルドは `python -m build`（引数なし）＝ sdist を作り、その sdist から wheel を作る。
# 上の exclude / VCS ignore で落ちるが sdist に入れなければならないファイルをここで救済する。
# **役割が逆向きの 2 群**が同居しているので取り違えないこと。
#
# 群 1: KEEP 救済（wheel に **残る** べき側）
#   `_excludes.py` / `hatch_build.py` の KEEP_PATTERNS が配布対象と定めている .gitkeep。
#   sdist exclude に該当して落ちると、sdist 経由の wheel から KEEP が欠落する。
# 群 2: 注入対照（wheel で **落ちる** べき側）
#   `state/setup_done.flag` は VCS ignore（root `.gitignore` の `.claude/state/*`）で
#   sdist から落ちるが、これが無いと除外フィルタが実際に通過する候補が 0 件になり
#   「空の緑」（何も落とさずに緑）になる。sdist にだけ入れ、wheel ビルド時に
#   hatch_build の should_skip が `state/*` で落とすことを scripts/verify_wheel.py が検証する。
[tool.hatch.build.targets.sdist.force-include]
".claude/reports/.gitkeep" = ".claude/reports/.gitkeep"
".claude/memory/sessions/.gitkeep" = ".claude/memory/sessions/.gitkeep"
".claude/tmp/.gitkeep" = ".claude/tmp/.gitkeep"
".claude/state/setup_done.flag" = ".claude/state/setup_done.flag"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: marks tests as slow"]
addopts = "-m 'not slow'"
